<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Cloudy — Iniciar sesión</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>☁️</text></svg>"/>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600&display=swap" rel="stylesheet"/>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;font-family:'Sora',sans-serif}
body{background:linear-gradient(135deg,#c8e8f7 0%,#e8f4fb 50%,#d4edd6 100%);display:flex;align-items:center;justify-content:center;min-height:100vh}

.card{
  background:white;border-radius:20px;
  padding:48px 40px;
  box-shadow:0 8px 40px rgba(58,100,140,0.12);
  text-align:center;width:360px;
}

.logo-icon{
  width:64px;height:64px;border-radius:18px;
  background:linear-gradient(135deg,#a8d8f0,#3a8fc4);
  display:flex;align-items:center;justify-content:center;
  font-size:30px;margin:0 auto 16px;
}
.logo-text{font-size:26px;font-weight:600;letter-spacing:-0.5px;color:#1a2633;margin-bottom:4px}
.logo-text span{color:#3a8fc4}
.tagline{font-size:13px;color:#6b8299;margin-bottom:36px}

.divider{
  display:flex;align-items:center;gap:12px;
  margin-bottom:24px;color:#9ab0c0;font-size:12px;
}
.divider::before,.divider::after{content:'';flex:1;height:1px;background:#e8f0f5}

.google-btn{
  display:flex;align-items:center;justify-content:center;gap:12px;
  width:100%;padding:13px 20px;
  background:white;border:1.5px solid #dde8f0;border-radius:12px;
  font-family:'Sora',sans-serif;font-size:14px;font-weight:500;color:#1a2633;
  cursor:pointer;text-decoration:none;
  transition:all 0.2s;
}
.google-btn:hover{background:#f5fafd;border-color:#3a8fc4;box-shadow:0 2px 12px rgba(58,143,196,0.15)}
.google-btn:active{transform:scale(0.98)}

.google-icon{width:20px;height:20px;flex-shrink:0}

.footer{margin-top:28px;font-size:11px;color:#9ab0c0;line-height:1.6}
</style>
</head>
<body>
<div class="card">
  <div class="logo-icon">☁️</div>
  <div class="logo-text">cloud<span>y</span></div>
  <div class="tagline">your tiny personal cloud</div>

  <div class="divider">iniciar sesión</div>

  <a href="/auth/google" class="google-btn">
    <svg class="google-icon" viewBox="0 0 24 24">
      <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
      <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
      <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
      <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
    </svg>
    Continuar con Google
  </a>

  <div class="footer">
    Al ingresar aceptás que tus archivos y notas<br>se almacenen en Orion de forma privada.
  </div>
</div>
</body>
</html>
